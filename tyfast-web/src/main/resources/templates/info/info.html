<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
  <!--/* 共用JS与CSS */-->
  <th:block th:replace="~{assets/include :: editor}"/>
  <th:block th:replace="~{assets/include :: katex}"/>
  <th:block th:replace="~{assets/include :: scriptcss_default('新闻资讯')}"/>
  <style>
    .ql-tooltip input[data-formula], .ql-tooltip input[data-link], .ql-tooltip input[data-video] {
      color: #000 !important;
    }
    .hm-210 {
      min-height: 210px;
    }
  </style>
</head>
<body>
  <div id="app" v-cloak>
    <v-app>
      <!-- 左侧区域::导航菜单 -->
      <th:block th:replace="~{assets/include :: navMenu}"/>

      <!-- 顶部功能区 -->
      <v-app-bar flat>
        <th:block th:replace="~{assets/include :: header}"/>
      </v-app-bar>

      <!-- 主体部分 -->
      <v-main>
        <!-- 主体容器 -->
        <v-container fluid>
          <!-- 查询条件 -->
          <v-sheet class="rounded-0 px-6 py-3">
            <v-form ref="queryForm" class="assist">
              <v-row>
                <v-col cols="12" sm="6" md="3">
                  <v-tree-select v-model="selectedOrgIds" mandatory :items="availableOrgs" :label="$t('机构')" @load="loadAvailableOrgs"></v-tree-select>
                </v-col>
                <v-col cols="12" sm="6" md="3">
                  <v-text-field v-model="param.title" hide-details clearable :label="$t('标题')"></v-text-field>
                </v-col>
                <v-col class="d-flex">
                  <v-btn color="primary" class="mr-2" @click="doQuery(1)">{{$t('查询')}}</v-btn>
                  <v-spacer></v-spacer>
                  <v-btn color="teal" @click="openWinDrawer('新增新闻资讯')" shiro:hasPermission="/info/save">
                    <v-icon size="small">mdi-plus</v-icon>
                    {{$t('新增')}}
                  </v-btn>
                </v-col>
              </v-row>
            </v-form>
          </v-sheet>

          <!-- 数据列表 -->
          <v-card flat tile ref="qcontainer" class="mt-3 v-fill-height overflow-auto position-static bg-transparent" :min-height="350" :loading="loading" :style="{'--ty-assist-height':assistHeight}">
            <v-card-zoom class="mb-2 ql-editor ql-readonly" v-for="item in dataList" :key="item.infoId">
              <v-card-title class="mb-1 d-flex text-subtitle-1">
                <v-btn color="primary" variant="tonal" :ripple="false">{{item.index}}.</v-btn>
                <v-spacer></v-spacer>
                <span class="mt-1 mr-4">{{item.publishTime}}</span>
              </v-card-title>
              <v-card-text class="v-rich-text">
                <div class="cursor-pointer" @click="item.show = !item.show">
                  {{item.title}}
                  <v-icon icon="mdi-chevron-down"></v-icon>
                </div>
                <v-expand-transition>
                  <div class="border-t-thin mt-4 pt-4" v-if="item.show">
                    <div v-katex v-html="item.content"></div>
                  </div>
                </v-expand-transition>
              </v-card-text>
              <v-card-actions class="justify-end border-t-thin">
                <v-btn color="teal" @click="openWinDrawer('修改新闻资讯', item.infoId)" shiro:hasPermission="/info/update">{{$t('修改')}}</v-btn>
                <v-popconfirm :data="item.infoId" @confirm="doDelete" shiro:hasPermission="/info/del">
                  <v-btn color="teal">{{$t('删除')}}</v-btn>
                </v-popconfirm>
              </v-card-actions>
            </v-card-zoom>
            <!-- No Data Tips -->
            <v-empty-state class="hm-auto" height="350" :headline="loading? loadingText : noDataText" v-if="!dataList || dataList?.length === 0"></v-empty-state>
          </v-card>
          <v-pagination class="assist pagebar" v-model="pagination.page" :total-visible="pagination.vp" :length="pagination.pageCount" :disabled="loading" v-show="dataList?.length > 0" @update:model-value="doQuery"></v-pagination>

          <!-- 数据表单抽屉窗口 -->
          <v-navigation-drawer :order="-1" v-model="winDrawer" persistent temporary floating location="right" :class="{'w-100':winDrawer}" style="z-index: 2002">
            <v-layout full-height>
              <tform as="v-form" ref="dataForm" class="w-100 overflow-auto" @submit="doSubmit">
                <v-app-bar flat color="indigo-darken-2">
                  <v-toolbar-title class="text-subtitle-1 font-weight-bold">
                    {{$t(drawerTitle)}}
                  </v-toolbar-title>
                  <v-btn icon="mdi-close" @click="closeWinDrawer"></v-btn>
                  <v-progress-linear :active="loading" :indeterminate="loading" color="teal" location="bottom" absolute></v-progress-linear>
                </v-app-bar>
                <v-card flat tile class="mt-16 mb-12">
                  <v-card-text>
                    <!-- 数据表单 -->
                    <tfield v-model.trim="formData.title" name="标题" v-slot="{ field, errors }" rules="required|max:30">
                      <v-text-field v-bind="field" :model-value="field.value" clearable v-blank type="text" :error-messages="errors" :label="$t('标题')" class="mt-1"></v-text-field>
                    </tfield>
                    <tfield v-model.trim="formData.publishTime" name="发布时间" v-slot="{ field, errors }" rules="required">
                      <v-date-picker-select v-model="formData.publishTime" clearable :label="$t('发布时间')" class="mt-1"></v-date-picker-select>
                      <input v-bind="field" type="hidden"/>
                      <div class="pl-4 v-input__details text-pink-lighten-2">{{errors[0]}}</div>
                    </tfield>
                    <div id="editor" class="text-black hm-210"></div>
                  </v-card-text>
                </v-card>
                <v-footer app class="border-t-thin justify-end">
                  <v-btn variant="outlined" class="mr-4" :disabled="posting" @click="closeWinDrawer">{{$t('关闭')}}</v-btn>
                  <v-btn color="primary" type="submit" :loading="posting" shiro:hasPermission="/info/save">{{$t('保存')}}</v-btn>
                </v-footer>
              </tform>
            </v-layout>
          </v-navigation-drawer>
        </v-container>
      </v-main>
    </v-app>
  </div>

  <!-- 导入Vuetify扩展组件 -->
  <th:block th:replace="~{assets/vuetify :: v-card-zoom}"/>
  <th:block th:replace="~{assets/vuetify :: v-popconfirm}"/>
  <th:block th:replace="~{assets/vuetify :: v-tree-select}"/>
  <th:block th:replace="~{assets/vuetify :: v-date-picker-select}"/>

  <!-- 业务js -->
  <script type="text/javascript" th:src="@{/js/info/info.js?_t=#buildtime#}"></script>
</body>
</html>
